        <link rel="icon" type="image/svg+xml" href="/triangle.svg">
        <script>
            // This code only runs in the browser
            (function() {
            try {
                const currentTheme = localStorage.getItem('theme');
                const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                if (currentTheme === 'dark' || (!currentTheme && supportDarkMode)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                } catch (e) {
                // Handle cases where localStorage is blocked (incognito mode)
                console.error("Theme preference could not be loaded");
                }
            })();
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                const newTheme = e.matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
            });
        </script>
