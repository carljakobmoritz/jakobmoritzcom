      <use xlink:href="#d4" transform="matrix(0.5, 0, 0, 0.5, 0.433013, -0.25)" />
      <use xlink:href="#d4" transform="matrix(0.5, 0, 0, 0.5, -0.433013, -0.25)" />
    </g>
    <g id="d6">
