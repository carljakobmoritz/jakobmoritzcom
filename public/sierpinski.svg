Changes: magenta fill, square canvas, and reusable geometry moved into defs.
-->
  <defs>
    <path id="t" d="M 0 1 L .8660254 -.5 -.8660254 -.5 Z" fill="#FF00FF" />
    <g id="d1">
      <use xlink:href="#t" transform="matrix(0.5, 0, 0, 0.5, 0, 0.5)" />
      <use xlink:href="#t" transform="matrix(0.5, 0, 0, 0.5, 0.433013, -0.25)" />
