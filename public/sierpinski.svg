<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 -119 1774 1774" role="img" aria-labelledby="title desc">
  <title id="title">Magenta Sierpiński triangle</title>
  <desc id="desc">Eight-level Sierpiński triangle in pure magenta (#FF00FF) on a transparent square canvas.</desc>
